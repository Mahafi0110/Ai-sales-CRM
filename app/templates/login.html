{% extends "base.html" %}
{% block title %}Sign in · {{ app_name }}{% endblock %}
{% block public %}
<div class="login-wrap d-flex align-items-center justify-content-center">
  <div class="card login-card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1"><i class="bi bi-stars"></i> {{ app_name }}</h1>
      <p class="text-muted mb-4">Sign in to continue</p>
      {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" name="email" type="email" value="{{ email or '' }}" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <button class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
